{% extends "base.html" %}
{% block title %}Upload · TrustVault{% endblock %}
{% block content %}
<section class="form-card wide"><div class="eyebrow">ADD TO YOUR VAULT</div><h1>Upload a document</h1><p class="muted">Maximum 10 MB. Allowed types: PDF, TXT, PNG, JPG, DOCX and CSV.</p>
<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Document title</label><input name="title" maxlength="120" placeholder="e.g. Project contract">
<label>Category</label><input name="category" maxlength="60" placeholder="e.g. Contracts, HR, Finance" value="General">
<label>Choose file</label><input type="file" name="file" required accept=".pdf,.txt,.png,.jpg,.jpeg,.docx,.csv">
<button class="button primary full" type="submit">Upload securely</button></form></section>
{% endblock %}
